name: Docker build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/hcf-studios/clawdbot:latest
            ghcr.io/hcf-studios/clawdbot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-e2e:
    runs-on: ubuntu-latest
    needs: docker-build
    env:
      SETUP_PASSWORD: ${{ secrets.E2E_SETUP_PASSWORD }}
      AMIKO_USER_ID: ${{ secrets.E2E_AMIKO_USER_ID }}
      AMIKO_TWIN_ID: ${{ secrets.E2E_AMIKO_TWIN_ID }}
      AMIKO_USER_TOKEN: ${{ secrets.E2E_AMIKO_USER_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.E2E_OPENROUTER_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run Docker e2e test
        run: npm run test:e2e:docker
